<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceScan — ลงเวลาเข้างาน</title>
<link rel="stylesheet" href="style.css">
<style>
  .topbar{max-width:1200px;width:calc(100% - 40px);margin:20px auto 0;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
  .layout{max-width:1200px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
  .cam-card{padding:18px}
  .cam{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#000}
  .cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .frame{position:absolute;inset:10% 22%;pointer-events:none}
  .frame i{position:absolute;width:42px;height:42px;border:3px solid rgba(255,255,255,.9);filter:drop-shadow(0 0 8px var(--a2))}
  .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:18px}
  .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:18px}
  .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:18px}
  .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:18px}
  .scanline{position:absolute;left:6%;right:6%;height:3px;border-radius:3px;
    background:linear-gradient(90deg,transparent,var(--a2),transparent);box-shadow:0 0 18px var(--a2);animation:scan 2.4s ease-in-out infinite}
  @keyframes scan{0%,100%{top:4%}50%{top:94%}}
  body.checking .scanline{animation-duration:.7s;background:linear-gradient(90deg,transparent,var(--ok),transparent);box-shadow:0 0 18px var(--ok)}
  .cam-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:10px 22px;border-radius:999px;white-space:nowrap;font-size:.95rem}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .side{display:flex;flex-direction:column;gap:20px}
  .clock{padding:28px;text-align:center}
  .time{font-size:3.6rem;font-weight:600;letter-spacing:2px;font-variant-numeric:tabular-nums;
    background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
  .shift{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  .shift div{padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
  .shift b{display:block;font-size:1.3rem;margin-top:2px}
  .recent{padding:22px;flex:1}
  .recent ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .recent li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);animation:slideIn .4s}
  .recent .meta{flex:1;min-width:0} .recent .meta small{color:var(--muted)}
  .result{padding:40px 48px;text-align:center;min-width:320px}
  .ring{width:100px;height:100px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:2.8rem;
    border:2px solid var(--ok);background:rgba(52,211,153,.12);box-shadow:0 0 40px rgba(52,211,153,.45)}
  .ring.out{border-color:var(--a2);background:rgba(34,211,238,.12);box-shadow:0 0 40px rgba(34,211,238,.45)}
  .ring.dup{border-color:var(--warn);background:rgba(251,191,36,.12);box-shadow:0 0 40px rgba(251,191,36,.45)}
  .r-type{margin-top:16px;color:var(--muted)}
  .r-time{font-size:2.4rem;font-weight:600;margin:2px 0 10px;font-variant-numeric:tabular-nums}
  @media(max-width:860px){.layout{grid-template-columns:1fr}.time{font-size:2.8rem}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<header class="topbar glass">
  <div class="brand">
    <div class="logo">FS</div>
    <div><h1 id="orgName">FaceScan</h1><small class="muted">ระบบลงเวลาด้วยใบหน้า</small></div>
  </div>
  <a href="admin.html" class="btn btn-sm">ผู้ดูแลระบบ</a>
</header>

<main class="layout">
  <section class="cam-card glass">
    <div class="cam">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <div class="frame"><i></i><i></i><i></i><i></i><div class="scanline"></div></div>
      <div class="cam-hint glass" id="hint">กำลังเตรียมระบบ...</div>
    </div>
    <div class="chips">
      <span class="chip warn" id="chipModel"><span class="dot"></span><span>กำลังโหลด AI</span></span>
      <span class="chip warn" id="chipCam"><span class="dot"></span><span>กำลังเปิดกล้อง</span></span>
      <span class="chip warn" id="chipGps"><span class="dot"></span><span>กำลังหาตำแหน่ง</span></span>
    </div>
  </section>

  <aside class="side">
    <div class="clock glass">
      <div class="time" id="time">00:00:00</div>
      <div class="muted" id="date"></div>
      <div class="shift">
        <div><small class="muted">เวลาเข้างาน</small><b id="ws">--:--</b></div>
        <div><small class="muted">เวลาเลิกงาน</small><b id="we">--:--</b></div>
      </div>
    </div>
    <div class="recent glass">
      <h3>สแกนล่าสุด</h3>
      <ul id="recent"><li class="muted" style="justify-content:center">ยังไม่มีการสแกน</li></ul>
    </div>
  </aside>
</main>

<div class="modal" id="resultModal">
  <div class="glass result">
    <div class="ring" id="rIcon">✓</div>
    <h2 id="rName"></h2>
    <p class="muted" id="rPos"></p>
    <div class="r-type" id="rType"></div>
    <div class="r-time" id="rTime"></div>
    <span class="badge" id="rStatus"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script src="config.js"></script>
<script>
const video = $('video'), canvas = $('overlay');
let pos = null, busy = false, cooldown = 0, stable = 0;
const recent = [];

function setChip(id, state, text) { const c = $(id); c.className = 'chip ' + state; c.lastElementChild.textContent = text; }
function hint(t) { $('hint').textContent = t; }

function tick() {
  const n = new Date();
  $('time').textContent = n.toLocaleTimeString('th-TH', { hour12: false });
  $('date').textContent = n.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
setInterval(tick, 1000); tick();

async function init() {
  try {
    const modelP = loadModels().then(() => setChip('chipModel', 'ok', 'AI พร้อมใช้งาน'));
    const cfgP = api('config').then(r => {
      if (!r.ok) throw r.error;
      $('orgName').textContent = r.config.ORG_NAME;
      $('ws').textContent = r.config.WORK_START;
      $('we').textContent = r.config.WORK_END;
    });
    startGPS();
    await startCam();
    await Promise.all([modelP, cfgP]);
    hint('มองตรงไปที่กล้อง');
    loop();
  } catch (e) {
    hint('เกิดข้อผิดพลาด'); toast('เริ่มระบบไม่สำเร็จ: ' + e, 'err');
  }
}

async function startCam() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video.srcObject = s; await video.play();
    setChip('chipCam', 'ok', 'กล้องพร้อม');
  } catch (e) { setChip('chipCam', 'err', 'เปิดกล้องไม่ได้'); throw 'ไม่ได้รับสิทธิ์ใช้กล้อง'; }
}

function startGPS() {
  if (!navigator.geolocation) return setChip('chipGps', 'err', 'ไม่รองรับ GPS');
  navigator.geolocation.watchPosition(
    p => { pos = { lat: p.coords.latitude, lng: p.coords.longitude }; setChip('chipGps', 'ok', `GPS ±${Math.round(p.coords.accuracy)} ม.`); },
    () => setChip('chipGps', 'err', 'กรุณาเปิดตำแหน่ง'),
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
  );
}

async function loop() {
  if (!busy && Date.now() > cooldown && video.readyState >= 2) {
    const det = await faceapi.detectSingleFace(video, detOpts()).withFaceLandmarks().withFaceDescriptor();
    draw(det);
    if (det && det.detection.score > 0.6) {
      stable++;
      hint(stable < 3 ? 'พบใบหน้าแล้ว นิ่งไว้สักครู่...' : 'กำลังตรวจสอบ...');
      if (stable >= 3) {
        stable = 0;
        if (!pos) hint('กำลังรอสัญญาณ GPS...');
        else await send(det.descriptor);
      }
    } else { stable = 0; if (Date.now() > cooldown) hint('มองตรงไปที่กล้อง'); }
  }
  setTimeout(loop, 250);
}

function draw(det) {
  const w = video.videoWidth, h = video.videoHeight;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  if (!det) return;
  const b = det.detection.box;
  ctx.strokeStyle = 'rgba(34,211,238,.95)'; ctx.lineWidth = 3;
  ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.width, b.height, 18); ctx.stroke();
}

async function send(descriptor) {
  busy = true; document.body.classList.add('checking');
  try {
    const r = await api('scan', { descriptor: Array.from(descriptor), lat: pos.lat, lng: pos.lng });
    if (r.ok) showResult(r); else { toast(r.error, 'err'); hint(r.error); }
  } catch (e) { toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'err'); }
  cooldown = Date.now() + 4000; busy = false; document.body.classList.remove('checking');
}

function showResult(r) {
  const map = { IN: ['เข้างาน', '✓', ''], OUT: ['ออกงาน', '➜', 'out'], DUP: ['บันทึกไว้แล้ว', '!', 'dup'] };
  const [label, icon, cls] = map[r.type];
  $('rIcon').className = 'ring ' + cls; $('rIcon').textContent = icon;
  $('rName').textContent = r.name;
  $('rPos').textContent = `${r.position || ''} · รหัส ${r.id}`;
  $('rType').textContent = label;
  $('rTime').textContent = r.time;
  $('rStatus').textContent = r.status;
  $('rStatus').className = 'badge ' + (r.status === 'ปกติ' ? 'ok' : 'warn');
  $('resultModal').classList.add('show');
  setTimeout(() => $('resultModal').classList.remove('show'), 3500);

  if (r.type !== 'DUP') {
    recent.unshift(r); recent.splice(5);
    $('recent').innerHTML = recent.map(x => `
      <li><span class="avatar">${x.name.charAt(0)}</span>
        <div class="meta"><b>${x.name}</b><br><small>${x.type === 'IN' ? 'เข้างาน' : 'ออกงาน'} · ${x.time}</small></div>
        <span class="badge ${x.status === 'ปกติ' ? 'ok' : 'warn'}">${x.status}</span></li>`).join('');
  }
}

init();
</script>
  <link rel="stylesheet" href="theme-scan.css?v=1">
</body>
</html>
